name: Deploy Site To Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser libraries
        run: npm ci --ignore-scripts

      - name: Check JavaScript
        run: node --check ui-optimized.js

      - name: Build data-free static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/node_modules/echarts/dist site/node_modules/xlsx/dist site/图标库
          cp index.html ui-optimized.css ui-optimized.js site/
          cp node_modules/echarts/dist/echarts.min.js site/node_modules/echarts/dist/
          cp node_modules/xlsx/dist/xlsx.full.min.js site/node_modules/xlsx/dist/
          cp 图标库/nissan-relief-hero-mobile.webp 图标库/nissan-relief-hero-tablet.webp 图标库/nissan-white-mark.png 图标库/黑白简易.png site/图标库/
          cat > site/report-data.js <<'EOF'
          window.REPORT_DATA = {"generatedAt":"","sourceFile":"","sourceSheet":"","rowCount":0,"skippedRows":0,"dateMin":"","dateMax":"","dates":[],"months":[],"regions":[],"subregions":[],"provinces":[],"cities":[],"groups":[],"dealerCodes":[],"dealers":[],"channels":[],"projects":[],"medias":[],"models":[],"availableDimensions":[],"completeDimensions":[],"missingDimensions":["date","month","region","subregion","province","city","group","dealerCode","dealer","channel","project","media","model"],"schema":["newLead","validLead","newStoreVisit","validTestDrive","bigOrder","lockOrder","delivery"],"rows":[],"costs":{"sourceFile":"","generatedAt":"","feeBasis":"","feeBearingChannels":[],"noFeeChannels":[],"channelFees":{},"mediaFees":[],"benchmarkRates":{},"overallFees":{}}};
          EOF
          touch site/.nojekyll

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=django604-channel-lead-analytics --branch=main --commit-dirty=true
